
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#09090c">
    <title>Sign Up | TrustVault</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --red: #ed1c24;
            --bright-red: #ff3841;
            --background: #09090c;
            --panel: #121217;
            --text: #f8f8fb;
            --muted: #a2a2ad;
            --border: #30252c;
        }

        body {
            min-height: 100vh;
            padding: 35px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 10% 10%,
                    rgba(237, 28, 36, 0.14), transparent 35%),
                radial-gradient(circle at 90% 90%,
                    rgba(237, 28, 36, 0.10), transparent 35%),
                var(--background);
            color: var(--text);
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .signup-container {
            width: 100%;
            max-width: 490px;
            padding: 45px;
            background: rgba(18, 18, 23, 0.96);
            border: 1px solid var(--border);
            border-radius: 25px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45);
        }

        .brand {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 11px;
            margin-bottom: 35px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: var(--red);
            color: white;
            font-size: 23px;
            box-shadow: 0 0 25px rgba(237, 28, 36, 0.25);
        }

        .brand span {
            color: var(--red);
        }

        .badge {
            width: fit-content;
            margin: 0 auto 22px;
            padding: 9px 14px;
            display: flex;
            align-items: center;
            gap: 9px;
            border: 1px solid #51242a;
            border-radius: 30px;
            background: #211115;
            color: #ff777d;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.4px;
        }

        .badge-dot {
            width: 7px;
            height: 7px;
            background: var(--red);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--red);
        }

        h1 {
            text-align: center;
            font-size: 31px;
            letter-spacing: -0.8px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: var(--muted);
            text-align: center;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 32px;
        }

        /* Django form styling */

        form p {
            margin-bottom: 20px;
        }

        form p label {
            display: block;
            margin-bottom: 9px;
            color: #eeeeF3;
            font-size: 13px;
            font-weight: 700;
        }

        form p input {
            width: 100%;
            height: 51px;
            padding: 0 15px;
            border: 1px solid #34343e;
            border-radius: 10px;
            outline: none;
            background: #0b0b10;
            color: white;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        form p input:focus {
            border-color: var(--red);
            box-shadow: 0 0 0 3px rgba(237, 28, 36, 0.10);
        }

        form p input::placeholder {
            color: #777783;
        }

        form ul {
            color: #ff8c92;
            font-size: 12px;
            padding-left: 20px;
            margin-top: 8px;
            line-height: 1.7;
        }

        .helptext {
            display: block;
            margin-top: 8px;
            color: #858590;
            font-size: 11px;
            line-height: 1.7;
        }

        .errorlist {
            color: #ff858b;
            font-size: 12px;
            margin: 8px 0;
            padding-left: 18px;
        }

        .signup-button {
            width: 100%;
            height: 55px;
            margin-top: 10px;
            border: 1px solid #ff454d;
            border-radius: 11px;
            background: linear-gradient(110deg, #c81019, #f12630);
            color: white;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.7px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .signup-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 9px 28px rgba(237, 28, 36, 0.27);
        }

        .login-link {
            margin-top: 27px;
            padding-top: 23px;
            border-top: 1px solid #29252c;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        .login-link a {
            color: #ff555d;
            text-decoration: none;
            font-weight: 800;
            margin-left: 4px;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .security-note {
            margin-top: 24px;
            text-align: center;
            color: #777783;
            font-size: 10px;
            letter-spacing: 1px;
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .signup-container {
                padding: 30px 23px;
                border-radius: 20px;
            }

            h1 {
                font-size: 27px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

<div class="signup-container">

    <div class="brand">
        <div class="brand-icon">✦</div>
        TRUST<span>VAULT</span>
    </div>

    <div class="badge">
        <span class="badge-dot"></span>
        CREATE YOUR SECURE ACCOUNT
    </div>

    <h1>Create Your Account</h1>

    <p class="subtitle">
        Join TrustVault to organize and manage your documents securely.
    </p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="signup-button">
            CREATE ACCOUNT &nbsp; →
        </button>
    </form>

    <div class="login-link">
        Already registered?
        <a href="{% url 'login' %}">Log in</a>
    </div>

    <div class="security-note">
        TRUSTVAULT &nbsp;•&nbsp; DOCUMENT SECURITY
    </div>

</div>

</body>
</html>
